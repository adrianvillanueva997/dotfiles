repos:
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: pnpm exec oxlint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: oxfmt
        name: oxfmt
        entry: pnpm exec oxfmt
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
